<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Frame</title>
  </head>
  <body>
    <main class="frame">
      <section class="clock">
        <div class="date" id="date"></div>
        <div class="time"><span id="time"></span><span class="seconds" id="seconds"></span></div>
        <button class="place" id="place"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.6a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2z" fill="currentColor"/></svg></button>
      </section>

      <section class="now" id="now" aria-live="polite"></section>

      <section class="hours" id="hours"></section>

      <section class="days" id="days"></section>

      <div class="status" id="status"></div>
    </main>

    <main class="calendar">
      <header class="cal-head"><div class="cal-accounts" id="cal-accounts"></div></header>
      <div class="cal-title"><span id="cal-date"></span><span class="cal-clock" id="cal-time"></span></div>
      <section class="cal-days" id="cal-days"></section>
      <div class="status" id="cal-status"></div>
    </main>

    <button class="view-toggle" id="view-toggle"></button>
    <dialog class="event-details" id="event-details"></dialog>
    <dialog class="event-details location-picker" id="location-picker">
      <div class="event-body location-body">
        <div class="event-head">
          <div class="event-title" id="location-title"></div>
          <button class="event-close" id="location-close"></button>
        </div>
        <input class="location-search" id="location-search" type="text" autocomplete="off" spellcheck="false" />
        <div class="location-results" id="location-results"></div>
      </div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
